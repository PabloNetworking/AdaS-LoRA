# FedIT with a mixed base-model precision (half of the clients 16-bit, half 32-bit).

seed: 50
use_gpu: True
device: 0

outdir: exp/fedit_quantized

federate:
  mode: standalone
  method: FedAvg
  client_num: 12
  total_round_num: 20
  save_to: "ckpt/fedit_quantized.ckpt"
  online_aggr: False
  ignore_weight: False
  share_local_model: False

data:
  root: data/
  type: 'sst2@glue'
  splits: [0.90, 0.10]
  splitter: 'iid'

dataloader:
  batch_size: 32

model:
  type: 'microsoft/deberta-large@huggingface_llm'
  task: 'SequenceClassification'
  out_channels: 2

trainer:
  type: gluetrainer

train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    lr: 0.0005
    weight_decay: 0.01
  scheduler:
    type: CosineAnnealingLR
    T_max: 20
  is_enable_half: False

criterion:
  type: CrossEntropyLoss

eval:
  freq: 5
  metrics: ['acc', 'f1', 'loss']
  split: ['val']
  report: ['weighted_avg']
  best_res_update_round_wise_key: val_acc
  count_flops: False

glue:
  max_length: 128
  retry_on_nan_loss: True

  adapter:
    use: True
    mv_to_cpu: False

    args:
      - adapter_package: peft
        adapter_method: lora
        target_modules: ['attention.self.in_proj', 'attention.output.dense',
                          'intermediate.dense', 'output.dense']
        r: 100
        lora_alpha: 16
        lora_dropout: 0.05
    base_quant:
        enabled: True
        distribution:
          '4': 0
          '8': 0
          '16': 0.5
          '32': 0.5

    max_rank: 100
    hetero_strategy: homo
    hetero_ranks: {}
    hetero_alpha: {}

    fah:
      enabled: False

# Adapter settings read from cfg.llm.adapter by parts of the shared method code.
llm:
  tok_len: 128

  adapter:
    use: True
    mv_to_cpu: False

    args:
      - adapter_package: peft
        adapter_method: lora
        target_modules: ['attention.self.in_proj', 'attention.output.dense',
                         'intermediate.dense', 'output.dense']
        r: 100
        lora_alpha: 16
        lora_dropout: 0.05
    base_quant:
        enabled: True
        distribution:
          '4': 0
          '8': 0
          '16': 0.5
          '32': 0.5

    max_rank: 100
    hetero_strategy: homo
    hetero_ranks: {}
    hetero_alpha: {}

    fah:
      enabled: False
